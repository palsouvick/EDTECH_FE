# Netlify — EDTECH frontend (static)
# The /api redirect (status 200) proxies API calls to the backend,
# so the app keeps using relative /api/v1 URLs (no CORS needed).
# TODO: replace the backend URL below once the backend is live on Koyeb.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://edtech-be.koyeb.app/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
