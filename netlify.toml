# Netlify — EDTECH frontend (static)
# The /api redirect (status 200) proxies API calls to the backend,
# so the app keeps using relative /api/v1 URLs (no CORS needed).
# Backend: Back4App container (temporary free URL — update when the
# backend gets a permanent home).
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://edtechbe-18xhfqay.back4.app/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
