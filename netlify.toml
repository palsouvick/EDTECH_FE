# Netlify — EDTECH frontend (static)
# The /api redirect (status 200) proxies API calls to the backend,
# so the app keeps using relative /api/v1 URLs (no CORS needed).
# Backend: the Render web service from EDTECH_BE/render.yaml. (The earlier
# Back4App container URL no longer exists — it answered 404 on 2026-11-16.)
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://edtech-be-178k.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
